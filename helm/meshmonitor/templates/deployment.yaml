apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meshmonitor.fullname" . }}
  labels:
    {{- include "meshmonitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "meshmonitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "meshmonitor.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /*
      Reticulum attach mode needs the whole pod on host networking -- the
      shared-instance RPC socket the bridge attaches to binds to 127.0.0.1, so
      only a pod sharing the host's network namespace can reach it. This is a
      Kubernetes pod-level setting (there is no per-container equivalent), so
      it applies to the main meshmonitor container too when enabled. tcp_peer
      mode dials out instead of attaching locally, so it does not need this.
      */}}
      {{- if and .Values.reticulum.enabled (eq .Values.reticulum.mode "attach") }}
      hostNetwork: true
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        env:
        - name: MESHTASTIC_NODE_IP
          value: {{ .Values.env.meshtasticNodeIp | quote }}
        - name: MESHTASTIC_USE_TLS
          value: {{ .Values.env.meshtasticUseTls | quote }}
        - name: NODE_ENV
          value: {{ .Values.env.nodeEnv | quote }}
        - name: PORT
          value: {{ .Values.env.port | quote }}
        {{- if .Values.env.baseUrl }}
        - name: BASE_URL
          value: {{ .Values.env.baseUrl | quote }}
        {{- end }}
        {{- if .Values.autoupgrade.enabled }}
        - name: AUTO_UPGRADE_ENABLED
          value: "true"
        {{- end }}
        {{- if .Values.extraEnv }}
        {{- toYaml .Values.extraEnv | nindent 8 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- if .Values.reticulum.enabled }}
      - name: reticulum-bridge
        image: {{ .Values.reticulum.image }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: RNS_MODE
          value: {{ .Values.reticulum.mode | quote }}
        - name: BRIDGE_HOST
          value: {{ splitList ":" .Values.reticulum.bind | first | quote }}
        - name: BRIDGE_PORT
          value: {{ splitList ":" .Values.reticulum.bind | last | quote }}
        - name: BRIDGE_TOKEN
          value: {{ .Values.reticulum.token | quote }}
        {{- if eq .Values.reticulum.mode "attach" }}
        - name: RNS_CONFIG_DIR
          value: "/rns"
        {{- end }}
        {{- if eq .Values.reticulum.mode "attach" }}
        volumeMounts:
        - name: rns-config
          mountPath: /rns
          readOnly: true
        {{- end }}
      {{- end }}
      volumes:
      - name: data
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.existingClaim | default (include "meshmonitor.fullname" .) }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- if and .Values.reticulum.enabled (eq .Values.reticulum.mode "attach") }}
      - name: rns-config
        hostPath:
          path: {{ .Values.reticulum.configDir }}
          type: Directory
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
