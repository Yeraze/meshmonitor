name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    # Deliberately NOT filtered by target branch. The retired pr-tests.yml ran on
    # PRs into *any* branch; this workflow used to be limited to main/develop, so
    # narrowing it here would silently leave PRs targeting release/feature
    # branches with no test run at all.
    types: [ opened, synchronize, reopened ]

# Inherited from the retired pr-tests.yml: without this, every push to a PR
# branch starts a full run and the superseded ones keep burning runners to
# completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meshmonitor_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_DATABASE: meshmonitor_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        # Node 20 dropped: nothing we ship runs it. The main image is Node 24,
        # the LXC template is NodeSource 24, and armv7 — the lowest target — is
        # Node 22 (Dockerfile.armv7 pins 22 because Node 24 has no ARMv7 build).
        # 20.x was test-only, and the ecosystem has moved past it: node-gyp 13
        # and its bundled undici require >=22, so a native rebuild of
        # better-sqlite3 now fails outright on Node 20.
        node-version: [22.x, 24.x, 25.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          submodules: recursive  # Initialize protobufs submodule for tests

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run lint ratchet
        # BLOCKING: fails only on new violations above the checked-in baseline.
        # Existing debt is frozen in eslint-baseline.json and burns down over time.
        # Regenerate baseline: npm run lint:baseline. Tracking: #3962 Task 1.4.
        run: npm run lint:ci

      - name: Run type checking
        run: npm run typecheck

      # Test-file type check runs on ONE Node version (non-blocking; tracks
      # toward a clean tsconfig.tests). Coverage generation + Codecov upload were
      # removed (#4172): they ran on a single leg, produced no enforced signal
      # (no token, no thresholds, no PR status check, no badge — Codecov was
      # already fail_ci_if_error:false), and @vitest/coverage-v8 hung for 30+ min
      # on Node 24, repeatedly blocking merges. `npm run test:coverage` remains
      # available for ad-hoc local reports.
      - name: Type-check tests (non-blocking)
        if: matrix.node-version == '24.x'
        run: npm run typecheck:tests
        # NON-BLOCKING: ~283 pre-existing test-type errors (mock/signature drift).
        # Flip to blocking (remove continue-on-error) once `npm run typecheck:tests` is clean (0 errors).
        # Tracking: remediation epic #3962 Task 1.2.
        continue-on-error: true

      # `--disableConsoleIntercept` for the same reason as the release workflow's
      # coverage step: `onUserConsoleLog` is the RPC a worker uses to ship a
      # test's console output to the main process, and with ~1,265 files logging
      # freely it can still be in flight when the worker is torn down. The run
      # then exits 1 on an unhandled
      #
      #   EnvironmentTeardownError: [vitest-worker]: Closing rpc while
      #   "onUserConsoleLog" was pending
      #
      # *after* reporting every file passed — costing a rerun on an otherwise
      # green PR. Seen on #5179, #5181 and #5192 in a single afternoon.
      # Disabling interception means that RPC never exists, so there is no race
      # to lose. Console output still reaches the log (it goes straight to
      # stdout instead of via the interceptor) and failures report unchanged;
      # measured locally the log got SMALLER, 1.58M lines to ~750k.
      - name: Run tests
        run: npm run test:run -- --disableConsoleIntercept

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          submodules: recursive  # Initialize protobufs submodule

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Build server
        run: npm run build:server

      - name: Check build artifacts
        run: |
          echo "Checking frontend build..."
          ls -la dist/
          echo "Checking server build..."
          ls -la dist/server/

      # Keeps main-chunk/asset size creep visible in CI before it trips the
      # vite-plugin-pwa precache cap and fails the build outright (#5526).
      - name: Check bundle size budgets
        run: npm run check:bundle-size

      # Node ESM resolves relative specifiers exactly — the extension is
      # required. tsc accepts an extensionless one and Vite resolves it, so a
      # backend file importing a frontend module written that way builds clean
      # and throws ERR_MODULE_NOT_FOUND only at runtime, inside a container or
      # a packaged desktop build. That is the shape of #4591. This walks the
      # graph the server actually loads and fails here instead of there.
      - name: Check runtime import resolution
        run: npm run check:imports

  docs-build:
    name: Documentation Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Absorbed from the retired pr-tests.yml, where it was the ONE job with
    # coverage this workflow did not already have. It is not redundant with
    # deploy-docs.yml: that only runs on push to main, i.e. after merge — so
    # without this, a VitePress build break is caught by the deploy, not the PR.
    #
    # Run unconditionally rather than behind a dorny/paths-filter `docs` gate.
    # The old gate keyed on `docs/**` and `**.md`, which missed the VitePress
    # config and the docs' own dependencies, and the build is ~1 min. Dropping
    # the gate is what let the `changed-files` job retire with pr-tests.yml.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --legacy-peer-deps

      - name: Build documentation
        run: npm run docs:build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          push: false
          load: true
          tags: meshmonitor:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm meshmonitor:test node --version
          docker run --rm meshmonitor:test ls -la /app/

      # #5692: the runtime image ships production dependencies only, runs every
      # long-running process as `node`, and still loads its native modules.
      - name: Verify runtime image (no dev deps, non-root, server healthy)
        run: |
          set -euo pipefail
          for pkg in vite vitest typescript eslint puppeteer; do
            if docker run --rm --entrypoint test meshmonitor:test -e "/app/node_modules/$pkg"; then
              echo "::error::devDependency '$pkg' is present in the runtime image"; exit 1
            fi
          done
          docker run --rm --entrypoint node -w /app meshmonitor:test --input-type=commonjs -e "
            const Database = require('better-sqlite3'); new Database(':memory:').prepare('select 1').get();
            require('bcrypt'); require('re2'); require('zstd-napi');
            require('@serialport/bindings-cpp');
            console.log('native modules OK');"
          docker run -d --name mm-smoke meshmonitor:test
          ok=false
          for i in $(seq 1 60); do
            if docker exec mm-smoke curl -sf http://localhost:3001/api/health >/dev/null; then ok=true; break; fi
            sleep 2
          done
          docker logs mm-smoke 2>&1 | tail -40
          $ok || { echo "::error::/api/health did not answer"; exit 1; }
          docker exec mm-smoke ps -o user=,args= | tee /tmp/ps.txt
          if grep -E 'supervisord|apprise-api|dist/server/server.js|npm start' /tmp/ps.txt | awk '$1 == "root" { found = 1; print } END { exit !found }'; then
            echo "::error::a long-running process is running as root"; exit 1
          fi
          docker rm -f mm-smoke

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          # The runner image ships a Google Chrome apt source that neither scan
          # job needs. `apt-get update` refreshes every configured source, so
          # when that repo serves an index whose hash disagrees with its
          # Release file, apt exits 100 and takes this step down with it —
          # before Trivy is ever installed, so the job fails with no SARIF and
          # no finding. Dropping the source keeps the failure surface to the
          # repos we actually asked for.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy vulnerability scanner
        run: trivy fs --scanners vuln --format sarif --output trivy-results.sarif --severity HIGH,CRITICAL .

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Dependency audit
        run: npm audit --audit-level=moderate
        continue-on-error: true  # Don't fail on audit issues for now

  clamav:
    name: ClamAV Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Every network call in this step is bounded and retried. On PR #5665
      # (run 37674527179) `apt-get update` stalled on the runner's Azure Ubuntu
      # mirror and, with no timeout anywhere, held this required check for
      # 3.5 hours. Normal step time is 15-25s; the slowest healthy run on
      # record took 323s (a 54 kB/s package download).
      - name: Install & update ClamAV
        timeout-minutes: 20
        run: |
          set -euo pipefail

          # bounded <label> <seconds per attempt> <command...>
          # Runs the command under `timeout`, up to 3 attempts, 15s apart.
          bounded() {
            local label="$1" limit="$2" attempt status
            shift 2
            for attempt in 1 2 3; do
              status=0
              sudo timeout --kill-after=15 "$limit" "$@" || status=$?
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
                echo "::warning::${label}: attempt ${attempt}/3 stalled (no finish within ${limit}s)"
              else
                echo "::warning::${label}: attempt ${attempt}/3 failed (exit ${status})"
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep 15
              fi
            done
            echo "::error::${label} stalled or failed on all 3 attempts (${limit}s limit each). This is a download problem on the runner, not a scan result. Re-run the job."
            return 1
          }

          # Same reason as the Trivy job above: drop the runner's Chrome apt
          # source so a bad index hash upstream cannot fail this step. `set -e`
          # makes it fatal here immediately, so ClamAV never runs and the job
          # reports a failure it never actually scanned for.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          bounded "apt-get update" 120 apt-get update
          # Fetch the packages first so a kill for a stalled download can never
          # land in the middle of dpkg. apt keeps partial files, so a retry
          # resumes the download.
          bounded "ClamAV package download" 300 apt-get install -y --download-only clamav clamav-freshclam
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          bounded "ClamAV virus database download (freshclam)" 300 freshclam --verbose

      # A .ign2 allow-list is only honored from inside the database directory —
      # passing it as a second `-d` does NOT work (verified). Installed BEFORE
      # the EICAR self-test below, so that test proves the allow-list did not
      # disable detection. See .github/clamav-ignore.ign2 for why each entry is
      # there and the evidence behind it.
      - name: Install ClamAV false-positive allow-list
        run: |
          set -euo pipefail
          sudo cp .github/clamav-ignore.ign2 /var/lib/clamav/
          echo "Suppressed signatures:"
          grep -v '^#' .github/clamav-ignore.ign2 | grep -v '^$'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify ClamAV detects EICAR signature
        run: |
          set -euo pipefail
          printf 'X5O!P%%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > eicar.com
          status=0
          clamscan eicar.com > eicar.log 2>&1 || status=$?
          cat eicar.log
          if [ "$status" -ne 1 ]; then
            echo "ClamAV failed to detect EICAR test signature" >&2
            exit 1
          fi
          rm -f eicar.com eicar.log

      - name: Scan source tree
        run: |
          set -euo pipefail
          clamscan -ri --exclude-dir='^\.git$' . | tee clamav.log
          if grep -qE 'Infected files: [1-9][0-9]*' clamav.log; then
            echo "ClamAV found infected files!" >&2
            grep 'FOUND' clamav.log >&2
            exit 1
          fi

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: clamav-scan-results
          path: clamav.log

  pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, build, docker]
    if: github.event_name == 'pull_request'

    steps:
      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        continue-on-error: true  # Don't fail if we can't comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            const comment = `## ✅ CI Checks Passed

            All tests and builds completed successfully!

            - **Tests**: All unit tests passing
            - **Type Check**: No TypeScript errors
            - **Build**: Frontend and server built successfully
            - **Docker**: Image builds successfully

            Ready for review! 🚀`;

            // Check if we already commented
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('CI Checks')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: comment
              });
            }