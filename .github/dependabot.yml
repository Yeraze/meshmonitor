version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    reviewers:
      - "yeraze"
    labels:
      - "dependencies"
      - "npm"
    ignore:
      # TypeScript 7's native compiler drops the JS compiler API that
      # @typescript-eslint depends on, breaking lint:ci. Hold major bumps
      # until the tooling ecosystem ships TS7-native support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # maplibre-gl 6 is ESM-only (default import removed) and reorganises
      # Map/Camera/events. Harder blocker: @maplibre/maplibre-gl-leaflet, which
      # backs VectorTileLayer, has no v6-compatible release (peer range stops
      # at ^5.0.0, last publish a year ago). Hold major bumps until that
      # adapter ships v6 support or VectorTileLayer is rewritten. See #4650
      # for the concrete unblock plan; closed #4646 shows the CI failure.
      - dependency-name: "maplibre-gl"
        update-types: ["version-update:semver-major"]
    groups:
      # vitest core and its companions (@vitest/coverage-v8, @vitest/ui) pin
      # each other EXACTLY — coverage-v8 5.0.0 declares
      # `peerDependencies: { vitest: "5.0.0" }`. Same hazard as the
      # codeql-action group below, in a different ecosystem.
      #
      # development-dependencies matched `vitest*` for minor/patch ONLY, so a
      # major fell outside every group and Dependabot opened one PR per
      # package: #5114 and #5107 bumped the companions to 5.0.0 with no
      # vitest-5 PR to pair them with.
      #
      # That combination is not merely inconvenient, it is invisible. `.npmrc`
      # sets legacy-peer-deps=true, so the mismatch INSTALLS without complaint,
      # and CI does not run coverage (removed from ci.yml when it hung on Node
      # 24; `npm run test:coverage` now runs only in release.yml). #5114 duly
      # reported CLEAN with 13 green checks while being unmergeable in
      # substance — the breakage would have surfaced as a failed coverage gate
      # mid-release.
      #
      # Listed FIRST so it wins the match, and takes every update-type so the
      # family always moves as one PR.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # react and react-dom refuse to run at different versions — react-dom
      # throws `Incompatible React versions: The "react" and "react-dom"
      # packages must have the exact same version` at import time. Ungrouped,
      # Dependabot opened #5210 (react-dom + @types/react-dom) and #5214
      # (react + @types/react) for the same 19.2.8 -> 19.3.0 release, and
      # NEITHER could merge: whichever landed first would leave main mismatched,
      # and each PR on its own failed all 1272 test files at collection with
      # "no tests" — a total CI wipeout that reads nothing like a version skew.
      #
      # Same hazard as the vitest and codeql-action groups: sibling packages
      # that pin each other exactly. Listed before `development-dependencies`
      # so `@types/react*` matches here rather than being split off into that
      # group, and takes every update-type so the family always moves as one PR.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "major"
          - "minor"
          - "patch"
      development-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "@testing-library/*"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          - "vitest*"
          # `vitest*` does NOT match the scoped companions — belt and braces so
          # a patch bump cannot fall into this catch-all if the vitest group
          # above is ever narrowed.
          - "@vitest/*"
          - "@testing-library/*"
        update-types:
          - "patch"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    rebase-strategy: "auto"
    reviewers:
      - "yeraze"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # github/codeql-action ships init/autobuild/analyze/upload-sarif as
      # sibling actions in one repo, and they MUST run at the same version —
      # init loads a config file that autobuild refuses to accept from a
      # different release. Without this group Dependabot opens one PR per
      # sibling, each broken in isolation; every one has to be closed and
      # replaced by a single hand-batched bump (see #4519/#4521/#4531 and
      # the batch that closed #4635/#4637/#4644).
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Enable security updates for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    rebase-strategy: "auto"
    reviewers:
      - "yeraze"
    labels:
      - "dependencies"
      - "docker"