; supervisord runs as the unprivileged `node` user: docker-entrypoint.sh drops
; privilege (su-exec on Alpine, gosu on the
; Debian armv7 image) before it execs supervisord (#5692). So there is no
; `user=` here and no su-exec in the program commands, and the pidfile lives in
; /tmp, which node can write. Children inherit node's uid and groups, including
; the serial-device groups the entrypoint granted.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:meshmonitor]
command=npm start
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",PORT="3001"

[program:apprise]
command=/opt/apprise-venv/bin/python /app/apprise-api.py
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=APPRISE_CONFIG_DIR="/data/apprise-config",APPRISE_STATEFUL_MODE="simple"
